// Top-level build file for the KinetiQ Android bridge.
// Requires: agconnect-services.json in app/ (downloaded from AppGallery
// Connect, gitignored) and a matching SHA-256 signing fingerprint.
plugins {
    id("com.android.application") version "8.1.4" apply false
    id("org.jetbrains.kotlin.android") version "1.9.22" apply false
    // AppGallery Connect plugin. Check the latest agcp version at:
    // https://developer.huawei.com/consumer/en/doc/development/AppGallery-connect-Guides/agc-get-started
    id("com.huawei.agconnect") version "1.9.1.301" apply false
}
